{% extends "base.html" %}
{% block content %}
<h2>Add Crop</h2>
<form method="post" class="card p-4 shadow-sm">
<div class="row">
<div class="col-md-6 mb-3"><label>Crop Name</label><input class="form-control" name="crop_name" required></div>
<div class="col-md-6 mb-3"><label>Quantity</label><input class="form-control" type="number" step="0.01" name="quantity" required></div>
<div class="col-md-6 mb-3"><label>Unit</label><select class="form-select" name="unit"><option>kg</option><option>quintal</option><option>ton</option></select></div>
<div class="col-md-6 mb-3"><label>Price per unit (₹)</label><input class="form-control" type="number" step="0.01" name="price" required></div>
<div class="col-md-6 mb-3"><label>Quality</label><input class="form-control" name="quality" placeholder="A / B / Organic"></div>
<div class="col-md-6 mb-3"><label>Location</label><input class="form-control" name="location" required></div>
<div class="col-md-6 mb-3"><label>Harvest Date</label><input class="form-control" type="date" name="harvest_date"></div>
</div>
<button class="btn btn-success">List Crop</button>
</form>
{% endblock %}
