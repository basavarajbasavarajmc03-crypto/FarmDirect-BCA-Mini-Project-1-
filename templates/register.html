{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7">
<h2>Create Account</h2>
<form method="post" class="card p-4 shadow-sm">
<input class="form-control mb-3" name="name" placeholder="Full name" required>
<input class="form-control mb-3" name="phone" placeholder="Phone number" required>
<input class="form-control mb-3" type="email" name="email" placeholder="Email" required>
<input class="form-control mb-3" type="password" name="password" placeholder="Password" required>
<select class="form-select mb-3" name="role" required>
<option value="farmer">Farmer</option><option value="buyer">Buyer</option>
</select>
<textarea class="form-control mb-3" name="address" placeholder="Address"></textarea>
<button class="btn btn-success">Register</button>
</form></div></div>
{% endblock %}
